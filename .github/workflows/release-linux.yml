name: Release Linux

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  NODE_VERSION: '24.x'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Linux artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Check tag matches package.json
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "v$VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version v$VERSION" >&2
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Build application
        run: pnpm build

      - name: Package Linux x64
        run: pnpm exec electron-builder --linux AppImage deb rpm tar.gz --x64 --publish never

      - name: Verify artifacts
        run: |
          ls -lh pack/*.AppImage pack/*.deb pack/*.rpm pack/*.tar.gz pack/latest-linux.yml

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Ostinato Music ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            pack/*.AppImage
            pack/*.deb
            pack/*.rpm
            pack/*.tar.gz
            pack/latest-linux.yml
          fail_on_unmatched_files: true
